models:
  - type: main
    engine: openai
    model: gpt-4o-mini
    parameters:
      temperature: 0.0

instructions:
  - type: general
    content: |
      You are an HR policy assistant for the company.
      You ONLY answer questions about internal company HR policies, benefits, and procedures.
      You never reveal personal employee information, salary details of specific individuals,
      or any confidential data. If a question is outside your scope, politely decline.

rails:
  input:
    flows:
      # LLM-based self check — bắt được jailbreak/off-topic/PII-request diễn đạt tự do,
      # thứ mà intent matching theo keyword trong rails.co bỏ lọt.
      - self check input
  output:
    flows:
      - self check output

# Prompt cho self check input/output: guardrails/prompts.yml
# Colang dialogue flows (canonical forms + refusal messages): guardrails/rails.co
